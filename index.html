<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    header {
      background-color: #222;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .logo {
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #4da6ff;
      text-decoration: underline;
    }

    #home {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }

    .hero-greeting {
      font-size: 1.2rem;
      color: #555;
      margin: 0;
    }

    .hero-name {
      font-size: 3rem;
      margin: 0;
    }

    .hero-tagline {
      font-size: 1.3rem;
      color: #555;
      margin: 0;
    }

    .hero-cta {
      margin-top: 1rem;
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      color: #fff;
      background-color: #222;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
    }

    .hero-cta:hover {
      background-color: #4da6ff;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <header>
    <nav>
      <div class="logo">Your Name</div>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#achievements">Achievements</a></li>
        <li><a href="#thoughts">Thoughts</a></li>
      </ul>
    </nav>
  </header>

  <!-- Home section -->
  <section id="home">
    <p class="hero-greeting">Hi, I'm</p>
    <h1 class="hero-name">Your Name</h1>
    <p class="hero-tagline">Your Role / Tagline Here</p>
    <a href="#projects" class="hero-cta">View My Work</a>
  </section>

  <!-- About section -->

  <!-- Education section -->

  <!-- Projects section -->

  <!-- Achievements section -->

  <!-- Contact section -->

  <!-- Thoughts section -->

  <!-- Footer -->
</body>
</html>
